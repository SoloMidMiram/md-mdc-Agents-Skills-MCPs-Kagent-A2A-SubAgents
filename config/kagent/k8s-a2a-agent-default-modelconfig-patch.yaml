# Merge patch rollback — restore shared default ModelConfig:
#   kubectl patch agent k8s-a2a-agent -n kagent --type merge \
#     --patch-file config/kagent/k8s-a2a-agent-default-modelconfig-patch.yaml
# Do NOT kubectl apply this file; it is not a complete Agent manifest.
# Kept under config/kagent/ (not deploy/) so kubeconform does not treat it as a resource.
spec:
  declarative:
    modelConfig: default-model-config
