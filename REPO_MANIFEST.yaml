# Repository Manifest — flat index of repo artifacts
#
# Fields:
#   path      — repo-root-relative path (or glob for multi-file sections)
#   purpose   — one of: onboarding | runbook | architecture | reference | script
#              | config | deploy | memory | entry | constraint
#   status    — stable | lab | deferred | historical
#   authority — true if this file is the canonical source of truth for its domain

entries:

  # — Entry point —
  - path: README.md
    purpose: entry
    status: stable
    authority: true

  # — Agent contract —
  - path: AGENTS.md
    purpose: reference
    status: stable
    authority: true

  # — Project constraints —
