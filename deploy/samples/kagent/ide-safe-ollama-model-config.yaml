# Target-specific Ollama ModelConfig for the IDE-safe Cursor profile.
# Do not mutate the shared default-model-config.
# Requires Ollama reachable from inside the cluster (not pod localhost).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: ide-safe-ollama-model-config
  namespace: kagent
  labels:
    app.kubernetes.io/managed-by: kagent-lab
    app.kubernetes.io/part-of: kagent-ide-safe-profile
spec:
  provider: Ollama
  model: qwen2.5:7b-instruct
  ollama:
    host: http://host.docker.internal:11434
