---
# ServiceAccount for the kagent tool server runtime.
# The tool server uses in-cluster kubeconfig for Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-tool-server
  namespace: kagent
  labels:
    app.kubernetes.io/managed-by: kagent-lab
    app.kubernetes.io/component: tool-server-runtime
---
# ClusterRole granting read-only access to the resources the kagent tools
# server needs for inspection. Bound to the tool server's ServiceAccount.
# This keeps the educational lab safe: no write verbs are granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-tool-server-readonly
  labels:
    app.kubernetes.io/managed-by: kagent-lab
    app.kubernetes.io/component: tool-server-runtime
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - namespaces
      - nodes
      - events
      - persistentvolumes
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]
  # Discovery access for k8s_get_available_api_resources
  - apiGroups: [""]
    resources:
      - pods/status
      - nodes/status
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
---
# Bind the read-only ClusterRole to the tool server's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-tool-server-readonly
  labels:
    app.kubernetes.io/managed-by: kagent-lab
    app.kubernetes.io/component: tool-server-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagent-tool-server-readonly
subjects:
  - kind: ServiceAccount
    name: kagent-tool-server
    namespace: kagent
---
# Deployment for the kagent tool MCP server. Image 0.0.13 does not support the
# --read-only flag, so Kubernetes API write protection is enforced by RBAC.
# UID/GID 1000 are required by the image; ghcr.io/kagent-dev is its trusted registry.
# The path-scoped Trivy exception rationale and expiration are in .trivyignore.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-tool-server
  namespace: kagent
  labels:
    app.kubernetes.io/managed-by: kagent-lab
    app.kubernetes.io/component: tool-server-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: tool-server-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tool-server-runtime
    spec:
      serviceAccountName: kagent-tool-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: ghcr.io/kagent-dev/kagent/tools:0.0.13
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --port=8084
          ports:
            - containerPort: 8084
              protocol: TCP
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
# Service exposing the MCP server on port 8000 (as expected by the existing
# RemoteMCPServer URL http://kagent-tool-server.kagent:8000/mcp).
# Traffic on port 8000 is forwarded to the container's MCP port 8084.
apiVersion: v1
kind: Service
metadata:
  name: kagent-tool-server
  namespace: kagent
  labels:
    app.kubernetes.io/managed-by: kagent-lab
    app.kubernetes.io/component: tool-server-runtime
spec:
  selector:
    app.kubernetes.io/component: tool-server-runtime
  ports:
    - port: 8000
      targetPort: 8084
      name: mcp
  type: ClusterIP
