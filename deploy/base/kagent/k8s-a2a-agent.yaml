apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: k8s-a2a-agent
  namespace: kagent
spec:
  description: An example A2A agent that can inspect Kubernetes resources.
  type: Declarative
  declarative:
    modelConfig: default-model-config
    systemMessage: |-
      You are an expert Kubernetes agent that uses tools to help users.
      Focus on read-only cluster inspection tasks.
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          toolNames:
            - k8s_get_resources
            - k8s_get_available_api_resources
    a2aConfig:
      skills:
        - id: get-resources-skill
          name: Get Resources
          description: Get resources in the Kubernetes cluster
          inputModes:
            - text
          outputModes:
            - text
          tags:
            - k8s
            - resources
          examples:
            - Get all resources in the Kubernetes cluster
            - Get the pods in the default namespace
            - Get the services in the kagent namespace
            - Get the deployments in the kagent namespace
