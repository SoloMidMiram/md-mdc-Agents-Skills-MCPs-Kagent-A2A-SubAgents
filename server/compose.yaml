services:
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:v0.0.76
    container_name: playwright-mcp
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8931/mcp', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.5"
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - node
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --isolated
      - --port
      - "8931"
      - --host
      - 0.0.0.0
    ports:
      - 127.0.0.1:8931:8931
