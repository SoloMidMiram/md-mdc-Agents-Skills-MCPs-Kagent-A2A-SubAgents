name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kagent-python:
    name: Deterministic kagent Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked development environment
        run: uv sync --frozen --group dev

      - name: Lint kagent Python code
        run: uv run ruff check scripts/kagent tests/kagent

      - name: Run deterministic Python tests
        run: uv run pytest -q

      - name: Validate workflow YAML
        run: uv run python -c 'import yaml,sys; d=yaml.safe_load(open(sys.argv[1])); assert all(j in d.get("jobs",{}) for j in ["kagent-python","kagent-kubernetes","kagent-security","evaluation"]); print("Workflow valid, jobs:", list(d["jobs"]))' .github/workflows/quality.yml

  kagent-kubernetes:
    name: Deterministic kagent Kubernetes validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Install kube-linter
        run: |
          curl -sSfL https://github.com/stackrox/kube-linter/releases/download/v0.7.1/kube-linter-linux.tar.gz | tar xz
          chmod +x kube-linter
          sudo mv kube-linter /usr/local/bin/
          kube-linter version

      - name: Validate Kubernetes manifests
        run: pwsh -NoProfile -File scripts/kubernetes/validate.ps1 -Strict

  kagent-security:
    name: Deterministic kagent Trivy policy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy v0.61.1
        run: |
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.61.1/trivy_0.61.1_Linux-64bit.deb
          echo "0a9ea23c0dfb5ab5f6afb613c41a3eabe44c8b3861cb60cc18fac4a079c6c577  trivy_0.61.1_Linux-64bit.deb" | sha256sum --check
          sudo dpkg -i trivy_0.61.1_Linux-64bit.deb
          # dpkg may warn about missing deps; install them if needed
          sudo apt-get install -y -qq -f 2>&1 | tail -2
          trivy --version

      - name: Run Trivy required-policy scan
        run: pwsh -NoProfile -File scripts/security/scan.ps1 -Required

  evaluation:
    name: Repository Evaluation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Codex CLI
        shell: pwsh
        run: npm install -g @openai/codex@0.141.0

      - name: Install Pester (3.4.0 + 6.0.1)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml==6.0.3

      - name: Validate config/templates JSON
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem config/templates/*.json | ForEach-Object {
            try { ConvertFrom-Json (Get-Content $_ -Raw) -ErrorAction Stop | Out-Null }
            catch { Write-Error "$($_.Name) is not valid JSON: $_"; $errors++ }
          }
          if ($errors -gt 0) { exit 1 }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          if ($results) { $results | Format-Table; exit 1 }
          Write-Output "PSScriptAnalyzer: no errors found."

      - name: Verify integration scaffold
        shell: pwsh
        run: .\scripts\integrations\verify-integration-scaffold.ps1

      - name: Run evaluation suite (Pester 6.0.1)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.0.1 -Force
          .\scripts\evaluation\run-evaluation.ps1 -CI

      - name: Run deterministic kagent PowerShell tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $result = Invoke-Pester -Path .\tests\kagent\KagentHealth.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Run kagent tooling validation tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $result = Invoke-Pester -Path .\tests\kagent\KagentToolingValidation.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: scripts/evaluation/results/
